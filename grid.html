<!-- grid exercise - 2  -->

<div class="container">
    <div class="header">Header</div>
    <div class="middle">
        <div class="aside">Aside</div>
        <div class="Article">
            <p>Article</p>

            <div class="images">
                <div class="img1">Image 1</div>
                <div class="img1">Image 2</div>
                <div class="img1">Image 3</div>
            </div>

        </div>

    </div>
    <div class="footer">Footer</div>
</div>

<style>
    .container {
        margin: 30px;
        background-color: rgb(134, 126, 190);
    }

    .header {
        padding: 30px;
        background-color: rgb(141, 190, 141);
        text-align: center;
        color: white;
    }

    .footer {
        padding: 30px;
        background-color: rgb(72, 158, 164);
        text-align: center;
        color: white;
    }

    .middle {
        background-color: rgb(213, 97, 97);
        color: white;
        padding: 2px;
        display: grid;
        grid-template-columns: 1fr 3fr;
        height: 500px;
    }

    .Article {
        display: grid;
        background-color: orange;
        /* justify-content: center; */
        align-items: center;
        text-align: center;
        margin: 5px;
    }

    .aside {
        background-color: rgb(72, 207, 72);
        margin: 2px;
        display: grid;
        justify-content: center;
        align-items: center;
    }

    .images {
        display: grid;
        grid-template-columns: 2fr 2fr 2fr;
        justify-content: space-between;
        align-items: center;
        text-align: center;
    }

    .img1 {
        background-color: rgb(182, 148, 86);
        color: white;
        margin: 5px;
        height: 300px;
        width: 350px;
        display: grid;
        /* justify-content: center; */
        align-items: center;
    }
</style>
